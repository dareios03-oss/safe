<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe</title>
<meta name="description" content="Safe: a private savings and investing tracker. Your data stays on your device.">
<meta name="theme-color" content="#E8ECF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05060F" media="(prefers-color-scheme: dark)">
<script>
/* keep the iOS status strip in the same colour as the page, also when light/dark mode switches */
(function(){var mq=matchMedia("(prefers-color-scheme: dark)");function s(){var m=document.getElementById("tc");if(!m){m=document.createElement("meta");m.name="theme-color";m.id="tc";document.head.appendChild(m);}var h=document.documentElement.classList.contains("hs");m.content=mq.matches?(h?"#000000":"#05060F"):(h?"#F2F2F7":"#E8ECF7");}window.__tc=s;s();mq.addEventListener?mq.addEventListener("change",s):mq.addListener(s);})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Safe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="hs.css">
<script>
/* design preview switch: ?style=health turns the Health style on, ?style=glass turns it off (remembered on this device) */
(function(){try{var q=new URLSearchParams(location.search).get("style");if(q)localStorage.setItem("safe-style",q);if(localStorage.getItem("safe-style")==="health"){document.documentElement.classList.add("hs");window.__tc&&window.__tc();}}catch(e){}})();
</script>
</head>
<body>
<div class="frame" id="frame">
  <div class="wall" aria-hidden="true">
    <div class="orb" style="left:-90px;top:-70px;width:330px;height:330px;background:var(--o1)"></div>
    <div class="orb" style="left:210px;top:170px;width:280px;height:280px;background:var(--o2)"></div>
    <div class="orb" style="left:-70px;top:460px;width:300px;height:300px;background:var(--o3)"></div>
    <div class="orb" style="left:220px;top:620px;width:260px;height:260px;background:var(--o4)"></div>
    <div class="topfade"></div>
  </div>
  <main class="screen" id="screen"></main>
  <div class="topedge" aria-hidden="true"></div>
  <div class="navbar" id="navbar"><button type="button" class="nav-t" data-act="totop" tabindex="-1"></button></div>
  <nav class="tabs glass" id="tabs" aria-label="Main"></nav>
  <div id="demotag" class="demotag" hidden></div>
  <div id="layer"></div>
</div>
<noscript><p style="padding:24px">Safe needs JavaScript to run.</p></noscript>
<script src="store.js"></script>
<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});});}
</script>
</body>
</html>
